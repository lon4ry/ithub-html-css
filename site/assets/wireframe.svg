<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-label="Схема главной страницы кофейни «Зерно»">
  <rect width="600" height="900" fill="#f6efe3"/>
  <g font-family="system-ui, sans-serif" fill="#2b1d16">
    <text x="24" y="16" font-size="12" fill="#6f5c4e">Схема главной страницы · кофейня «Зерно»</text>

    <rect x="24" y="28" width="552" height="52" rx="10" fill="#fffaf3" stroke="#d8c7b0"/>
    <text x="44" y="59" font-size="14" font-weight="600">Логотип и название</text>
    <text x="420" y="59" font-size="13" fill="#6f5c4e">О нас · Меню · Отзывы · Контакты</text>

    <rect x="24" y="92" width="552" height="180" rx="12" fill="#2b1d16"/>
    <text x="44" y="140" font-size="20" font-weight="700" fill="#fffaf3">Заголовок первого экрана</text>
    <text x="44" y="166" font-size="13" fill="#e6d6c3">Подзаголовок в одну-две строки</text>
    <rect x="44" y="190" width="120" height="34" rx="17" fill="#b4642f"/>
    <text x="66" y="212" font-size="12" fill="#fffaf3">Кнопка</text>
    <circle cx="470" cy="182" r="52" fill="none" stroke="#c8873a" stroke-dasharray="4 4"/>
    <text x="438" y="186" font-size="11" fill="#e6d6c3">Обложка</text>

    <text x="24" y="306" font-size="16" font-weight="700">О нас</text>
    <rect x="24" y="318" width="360" height="76" rx="10" fill="#fffaf3" stroke="#d8c7b0"/>
    <rect x="404" y="318" width="172" height="76" rx="10" fill="#fffaf3" stroke="#d8c7b0"/>
    <text x="416" y="348" font-size="11" fill="#6f5c4e">Цифры</text>
    <rect x="416" y="358" width="72" height="8" rx="4" fill="#e4d7c4"/>

    <text x="24" y="430" font-size="16" font-weight="700">Меню</text>
    <g fill="#fffaf3" stroke="#d8c7b0">
      <rect x="24" y="442" width="174" height="86" rx="10"/>
      <rect x="214" y="442" width="174" height="86" rx="10"/>
      <rect x="404" y="442" width="172" height="86" rx="10"/>
    </g>
    <g fill="#e4d7c4">
      <rect x="40" y="458" width="90" height="8" rx="4"/>
      <rect x="230" y="458" width="90" height="8" rx="4"/>
      <rect x="420" y="458" width="90" height="8" rx="4"/>
      <rect x="40" y="476" width="130" height="6" rx="3"/>
      <rect x="230" y="476" width="130" height="6" rx="3"/>
      <rect x="420" y="476" width="130" height="6" rx="3"/>
      <rect x="40" y="500" width="60" height="10" rx="5"/>
      <rect x="230" y="500" width="60" height="10" rx="5"/>
      <rect x="420" y="500" width="60" height="10" rx="5"/>
    </g>

    <text x="24" y="564" font-size="16" font-weight="700">Как мы обжариваем</text>
    <g fill="#fffaf3" stroke="#d8c7b0">
      <rect x="24" y="576" width="126" height="70" rx="10"/>
      <rect x="166" y="576" width="126" height="70" rx="10"/>
      <rect x="308" y="576" width="126" height="70" rx="10"/>
      <rect x="450" y="576" width="126" height="70" rx="10"/>
    </g>
    <g font-size="11" fill="#6f5c4e">
      <text x="40" y="602">Шаг 1</text>
      <text x="182" y="602">Шаг 2</text>
      <text x="324" y="602">Шаг 3</text>
      <text x="466" y="602">Шаг 4</text>
    </g>

    <rect x="24" y="666" width="552" height="98" rx="12" fill="#efe5d6"/>
    <text x="44" y="694" font-size="14" font-weight="600">Отзывы гостей</text>
    <rect x="44" y="706" width="250" height="44" rx="8" fill="#fffaf3"/>
    <rect x="306" y="706" width="250" height="44" rx="8" fill="#fffaf3"/>

    <text x="24" y="800" font-size="16" font-weight="700">Как нас найти</text>
    <rect x="24" y="812" width="264" height="60" rx="10" fill="#fffaf3" stroke="#d8c7b0"/>
    <rect x="304" y="812" width="272" height="60" rx="10" fill="#fffaf3" stroke="#d8c7b0"/>
    <text x="44" y="838" font-size="11" fill="#6f5c4e">Адрес и часы работы</text>
    <text x="324" y="838" font-size="11" fill="#6f5c4e">Форма бронирования</text>
  </g>
</svg>
